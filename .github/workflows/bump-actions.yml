---
name: Bump actions

# Fan-out over every non-agent repos.yaml target plus this repo, so one new action
# release lands everywhere at once instead of per-repo dependabot schedules. Per repo
# it bumps every versioned `uses: <owner>/<repo>[/<path>]@<ref>` in .github/workflows,
# .github/actions and a root action.yml to the latest tag of the same precision (v4
# stays a major tag, v4.7.0 stays exact), never downgrading, then opens or updates ONE
# PR. SHA pins, local actions and branch refs such as @main are left alone. In this
# repo it also bumps the infer CLI cli-version default of the reusable infer.yml.
# kind: agent repos get their pins from the adl-cli templates (bump-adl.yml).

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Single non-agent repos.yaml target or .github to bump (omit = all). Use to test on one repo.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Print the bumps but skip PR creation (manual runs preview by default; cron bumps for real)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.all.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: read
        if: inputs.repository != '.github'
        uses: ./.github/actions/resolve-targets
        with:
          select: '.kind != "agent"'
          repository: ${{ inputs.repository }}
      - id: all
        env:
          TARGETS: ${{ steps.read.outputs.targets }}
          ONLY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          targets=${TARGETS:-[]}
          if [ -z "$ONLY" ] || [ "$ONLY" = ".github" ]; then
            targets=$(jq -c '. + [{"name": ".github"}]' <<<"$targets")
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  bump:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: bump-actions-${{ matrix.target.name }}
      cancel-in-progress: false
    env:
      TARGET: ${{ matrix.target.name }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Mint GitHub App token (scoped to ${{ matrix.target.name }})
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}
          owner: inference-gateway
          repositories: |
            ${{ matrix.target.name }}

      - name: Checkout target
        uses: actions/checkout@v7.0.1
        with:
          repository: inference-gateway/${{ matrix.target.name }}
          path: target
          token: ${{ steps.token.outputs.token }}

      - name: Bump action pins to the latest tags
        id: bump
        working-directory: target
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          latest_like() {
            local prefix=${2%%[0-9]*} parts
            parts=$(awk -F. '{print NF}' <<<"$2")
            git ls-remote --tags --refs "https://github.com/$1.git" 2>/dev/null \
              | sed -nE 's|.*refs/tags/(v?[0-9]+(\.[0-9]+)*)$|\1|p' \
              | grep -E "^${prefix}[0-9]+(\.[0-9]+){$((parts - 1))}$" | sort -V | tail -1 || true
          }
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]; }

          rows=""
          files=(.github/workflows/*.y*ml .github/actions/**/action.y*ml action.y*ml)
          if [ "${#files[@]}" -gt 0 ]; then
            while read -r action old; do
              latest=$(latest_like "$(cut -d/ -f1-2 <<<"$action")" "$old")
              if [ -z "$latest" ]; then
                echo "::warning::${TARGET}: no tag like ${old} found for ${action}; left as is"
                continue
              fi
              newer "$old" "$latest" || continue
              sed -i -E "s#(uses: *[\"']?${action//./\\.})@${old//./\\.}([\"'[:space:]]|\$)#\1@${latest}\2#" "${files[@]}"
              rows+="| \`${action}\` | \`${old}\` | \`${latest}\` |"$'\n'
            done < <(grep -hoE "uses: *[\"']?[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@v?[0-9]+(\.[0-9]+)*([\"'[:space:]]|\$)" "${files[@]}" \
              | sed -E "s/^uses: *[\"']?//; s/[\"'[:space:]]+\$//; s/@/ /" | sort -u)
          fi

          infer=.github/workflows/infer.yml
          if [ "$TARGET" = ".github" ] && [ -f "$infer" ]; then
            old=$(sed -nE '/^      cli-version:/,/default:/ s/^ *default: (v[0-9.]+).*/\1/p' "$infer")
            latest=$(latest_like inference-gateway/cli "$old")
            if [ -n "$latest" ] && newer "$old" "$latest"; then
              sed -i -E "/^      cli-version:/,/default:/ s/(default: )${old//./\\.}/\1${latest}/" "$infer"
              rows+="| infer CLI (\`cli-version\`) | \`${old}\` | \`${latest}\` |"$'\n'
            fi
          fi

          printf '%s' "$rows"
          {
            echo 'rows<<ROWS_EOF'
            printf '%s' "$rows"
            echo 'ROWS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Show diff
        working-directory: target
        run: |
          git -c color.ui=always diff
          if git diff --quiet; then
            echo "::notice::${TARGET}: every action pin is already on its latest tag"
          fi

      - name: Create or update pull request
        if: steps.bump.outputs.rows != '' && env.DRY_RUN == 'false'
        id: pr
        uses: peter-evans/create-pull-request@v8.1.2
        with:
          token: ${{ steps.token.outputs.token }}
          path: target
          branch: bot/bump-actions
          base: main
          sign-commits: true
          delete-branch: true
          commit-message: 'chore(deps): bump GitHub Actions to latest'
          title: 'chore(deps): bump GitHub Actions to latest'
          body: |
            ## Summary
            Bumps every versioned action pin in this repo's workflows to the latest tag of the same precision:

            | Action | Old | New |
            |---|---|---|
            ${{ steps.bump.outputs.rows }}

            The same bump runs across every non-agent repo at once, so a new action release lands org-wide in one go instead of on per-repo dependabot schedules. SHA pins, local actions and branch refs (`@main`) are left alone.

            Filed by [bump-actions.yml](https://github.com/inference-gateway/.github/blob/main/.github/workflows/bump-actions.yml).
          labels: |
            dependencies

      - name: Report PR outcome
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          {
            echo "### ${TARGET}"
            echo "- Operation: \`${{ steps.pr.outputs.pull-request-operation }}\`"
            echo "- PR: ${{ steps.pr.outputs.pull-request-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: steps.bump.outputs.rows != '' && env.DRY_RUN == 'true'
        env:
          ROWS: ${{ steps.bump.outputs.rows }}
        run: |
          {
            echo "## Dry-run: ${TARGET}"
            echo
            echo '| Action | Old | New |'
            echo '|---|---|---|'
            printf '%s\n' "$ROWS"
          } >> "$GITHUB_STEP_SUMMARY"
