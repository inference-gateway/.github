---
name: Claude Code (reusable)

# Reusable @claude bot workflow for the inference-gateway org.
#
# Single source of truth for the per-repo `.github/workflows/claude.yml` that
# every repo used to copy-paste (~120 lines, ~80% identical). Callers now reduce
# to a ~10-line `uses:` invocation; a fix here (e.g. an invalid --effort value)
# is one commit + a tag move instead of one PR per repo.
#
# Caller contract:
#   jobs.claude.uses: inference-gateway/.github/.github/workflows/claude.yml@v1
# The `on:` triggers and the `@claude` gate `if:` stay in the caller (event
# triggers cannot live in a reusable workflow, and keeping the gate on the
# caller job avoids spinning up this runner for every non-@claude comment).
#
# Tools model: a constant default set applies to EVERY repo; the `language`
# preset appends its toolchain tools; `extra-tools` appends per-repo specifics.

on:
  workflow_call:
    inputs:
      language:
        description: 'Toolchain preset: go | rust | typescript | node | python | bun | none'
        type: string
        default: none
      runner:
        description: 'Runner image (low-code passes ubuntu-latest)'
        type: string
        default: ubuntu-24.04
      effort:
        description: 'Claude effort: low | medium | high | xhigh | max'
        type: string
        default: low
      model:
        description: 'Claude model id'
        type: string
        default: claude-fable-5
      prompt:
        description: 'Free-text task for manual (workflow_dispatch) runs. Empty = issue/PR mode (task comes from the @claude comment).'
        type: string
        default: ''
      extra-tools:
        description: 'Comma-separated tools appended to the default + language tool set, e.g. "Bash(helm:*)"'
        type: string
        default: ''
      allowed-tools:
        description: 'Full --allowedTools override. When set, replaces the default+language+extra set entirely (escape hatch for repos that deliberately narrow scope).'
        type: string
        default: ''
      node:
        description: 'Force Node setup even when language is not typescript/node (Go repos that also need Node)'
        type: boolean
        default: false
      context7:
        description: 'Include the context7 MCP server (+ mcp__context7 tool)'
        type: boolean
        default: true
      browser:
        description: 'Enable the browser MCP server for this run (installs Chromium + adds the @playwright/mcp server and the mcp__playwright tool). Sources, ORed: the static per-repo value from repos.yaml, the dispatch checkbox (forwarded by the caller), and a case-insensitive [browser] marker in the issue/comment/review body or issue title. The engine is chosen with `browser_engine` (or a [browser:<engine>] marker, which also enables the browser).'
        type: boolean
        default: false
      browser_engine:
        description: 'Browser backend when `browser` is enabled: chromium (default) | firefox | webkit (each installed via Playwright) | lightpanda (runs the lightpanda/browser container as a CDP server and points @playwright/mcp at it - no browser install, much faster startup, but only partial Web API coverage, so sites that need a full browser should stay on chromium). Sources, in precedence order: a case-insensitive [browser:<engine>] marker in the issue/comment/review body or issue title, then this input (per-repo value from repos.yaml or the dispatch choice forwarded by the caller).'
        type: string
        default: chromium
      markdownlint:
        description: 'Set up Node and install markdownlint-cli'
        type: boolean
        default: false
      prettier:
        description: 'Set up Node and install prettier'
        type: boolean
        default: false
      eslint:
        description: 'Set up Node and install eslint'
        type: boolean
        default: false
      precommit:
        description: 'Install pre-commit and run `task precommit:install`'
        type: boolean
        default: false
      extra-mcp-servers:
        description: 'JSON object of additional mcpServers merged into --mcp-config'
        type: string
        default: '{}'
      plugins:
        description: 'Newline-separated GitHub plugin marketplaces (owner/repo) to register and enable for the run, mirroring the `plugins` input on infer.yml. Each entry registers the repo as a Claude Code plugin marketplace AND enables the plugin whose name is the repo basename (e.g. "DietrichGebert/ponytail" -> marketplace "ponytail" + plugin "ponytail@ponytail"). Mapped to the claude-code-action native `plugins` + `plugin_marketplaces` inputs (settings-based extraKnownMarketplaces/enabledPlugins are ignored in headless runs). Default none.'
        type: string
        default: ''
      skills:
        description: 'Newline-separated skill names to install for the run, mirroring the `skills` input on infer.yml. Each name is resolved through inference-gateway/skills catalog.json (the built form of skills.yaml): its source may be vendored in the skills repo or point at another repo (e.g. adl, opentask), and the skill body is copied into ~/.claude/skills/<name> where Claude Code auto-discovers it as a user-level skill (claude-code-action has no native skills input). Unknown names fail the job. Default none.'
        type: string
        default: ''
      debug:
        description: 'Enable Claude CLI debug logging (--debug -> stderr) and full JSON output (show_full_output) in the run log. Defaults false; turn on per-repo via repos.yaml for verbose agent logs (private repos only - debug output can include sensitive values).'
        type: boolean
        default: false
      memory:
        description: 'Persist Claude Code auto-memory across runs by syncing ~/.claude/memory to/from the private inference-gateway/.memory repo (claude branch). When false, memory stays ephemeral (per-run, machine-local).'
        type: boolean
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'OAuth token for anthropics/claude-code-action (callers use `secrets: inherit`)'
        required: true

permissions:
  contents: read

jobs:
  claude:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            .github
            .memory
            python-sdk
            typescript-sdk
            rust-sdk
            sdk
            docs
            adk
            rust-adk
            typescript-adk
            browser-agent
            documentation-agent
            google-calendar-agent
            grafana-agent
            mock-agent
            n8n-agent
            cli
            a2a-debugger
            adl-cli
            adl
            inference-gateway
            infer-action
            operator
            registry
            schemas
            skills
            agents
            opentask
            binaries
            desktop
            tokenless

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set up Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global commit.gpgsign false
          git config --global commit.signoff true
    
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.48.0
          repo-token: ${{ steps.app-token.outputs.token }}

      - name: Install Flox
        uses: flox/install-flox-action@v2.6.0

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ hashFiles('go.mod') != '' && 'go.mod' || '' }}
          go-version: ${{ hashFiles('go.mod') == '' && 'stable' || '' }}
          cache: ${{ hashFiles('go.mod') != '' }}

      - name: Install golangci-lint
        if: inputs.language == 'go' && hashFiles('go.mod') != ''
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - name: Set up Rust
        if: inputs.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy, rustfmt

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'

      - name: Set up Bun
        if: inputs.language == 'bun'
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install repo dependencies
        if: inputs.language == 'bun' && hashFiles('bun.lock') != ''
        run: bun install --frozen-lockfile

      - name: Resolve browser mode
        id: browser
        env:
          BROWSER_INPUT: ${{ inputs.browser }}
          ENGINE_INPUT: ${{ inputs.browser_engine }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          text="$(printf '%s\n%s\n%s\n%s\n' \
                   "$ISSUE_TITLE" "$ISSUE_BODY" "$COMMENT_BODY" "$REVIEW_BODY")"

          enabled=false
          engine="${ENGINE_INPUT:-chromium}"

          # [browser:<engine>] both enables the browser and picks the backend.
          marker="$(printf '%s' "$text" | grep -oiE '\[browser:[a-z]+\]' | head -n1 || true)"
          if [ -n "$marker" ]; then
            enabled=true
            engine="$(printf '%s' "$marker" | sed -E 's|^\[browser:||I; s|\]$||' | tr '[:upper:]' '[:lower:]')"
          elif [ "$BROWSER_INPUT" = "true" ] || printf '%s' "$text" | grep -qiF '[browser]'; then
            enabled=true
          fi

          case "$engine" in
            chromium|firefox|webkit|lightpanda) ;;
            *) echo "::error::Invalid browser_engine '$engine' (expected: chromium | firefox | webkit | lightpanda)"; exit 1 ;;
          esac

          echo "Browser MCP enabled: $enabled (engine: $engine)"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

      - name: Resolve effort and model
        id: agent
        env:
          USER_PROMPT: ${{ inputs.prompt }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          INPUT_EFFORT: ${{ inputs.effort }}
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          effort="$INPUT_EFFORT"
          model="$INPUT_MODEL"
          text="$(printf '%s\n%s\n%s\n%s\n%s\n' \
                   "$USER_PROMPT" "$ISSUE_TITLE" "$ISSUE_BODY" "$COMMENT_BODY" "$REVIEW_BODY")"

          em="$(printf '%s' "$text" \
                | grep -oiE '\[effort:[^]]+\]' | head -n1 || true)"
          if [ -n "$em" ]; then
            effort="$(printf '%s' "$em" | sed -E 's|^\[effort:||I; s|\]$||' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi

          mm="$(printf '%s' "$text" \
                | grep -oiE '\[model:[^]]+\]' | head -n1 || true)"
          if [ -n "$mm" ]; then
            model="$(printf '%s' "$mm" | sed -E 's|^\[model:||I; s|\]$||' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi

          echo "Resolved effort: $effort"
          echo "Resolved model: $model"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: inputs.language == 'typescript' || inputs.language == 'node' || inputs.node || inputs.markdownlint || inputs.prettier || inputs.eslint || steps.browser.outputs.enabled == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install markdownlint
        if: inputs.markdownlint
        run: npm install -g markdownlint-cli

      - name: Install prettier
        if: inputs.prettier
        run: npm install -g prettier

      - name: Install eslint
        if: inputs.eslint
        run: npm install -g eslint

      - name: Install pre-commit
        if: inputs.precommit
        run: |
          set -euo pipefail
          pip install pre-commit
          task precommit:install

      - name: Install Playwright browser
        if: steps.browser.outputs.enabled == 'true' && steps.browser.outputs.engine != 'lightpanda'
        run: npx -y playwright@latest install --with-deps ${{ steps.browser.outputs.engine }}

      - name: Start Lightpanda CDP server
        if: steps.browser.outputs.enabled == 'true' && steps.browser.outputs.engine == 'lightpanda'
        run: |
          set -euo pipefail
          docker run -d --name lightpanda -p 127.0.0.1:9222:9222 lightpanda/browser:nightly

          for _ in $(seq 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9222) 2>/dev/null; then
              echo "Lightpanda CDP server listening on ws://127.0.0.1:9222"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Lightpanda did not start listening on 127.0.0.1:9222 within 30s"
          docker logs lightpanda || true
          exit 1

      - name: Determine branch prefix
        id: prefix
        env:
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          text="$(printf '%s %s' "$ISSUE_LABELS" "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]')"
          case "$text" in
            *bug*|*fix*|*defect*|*regression*|*hotfix*) prefix="fix/" ;;
            *feat*|*feature*|*enhancement*)             prefix="feat/" ;;
            *docs*|*documentation*)                     prefix="docs/" ;;
            *refactor*)                                 prefix="refactor/" ;;
            *)                                          prefix="claude/" ;;
          esac
          echo "Resolved branch prefix: $prefix"
          echo "value=$prefix" >> "$GITHUB_OUTPUT"

      - name: Compose Claude args
        id: args
        env:
          LANGUAGE: ${{ inputs.language }}
          ALLOWED: ${{ inputs.allowed-tools }}
          EXTRA_TOOLS: ${{ inputs.extra-tools }}
          CONTEXT7: ${{ inputs.context7 }}
          BROWSER: ${{ steps.browser.outputs.enabled }}
          BROWSER_ENGINE: ${{ steps.browser.outputs.engine }}
          EXTRA_MCP: ${{ inputs.extra-mcp-servers }}
          NODE: ${{ inputs.node }}
          PRETTIER: ${{ inputs.prettier }}
          ESLINT: ${{ inputs.eslint }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          servers='{}'
          if [ "$CONTEXT7" = "true" ]; then
            servers="$(echo "$servers" | jq -c '. + {context7:{command:"npx",args:["-y","@upstash/context7-mcp@latest"]}}')"
          fi
          if [ "$BROWSER" = "true" ]; then
            if [ "$BROWSER_ENGINE" = "lightpanda" ]; then
              pw_args='["-y","@playwright/mcp@latest","--cdp-endpoint","ws://127.0.0.1:9222"]'
            else
              pw_args='["-y","@playwright/mcp@latest","--headless","--browser","'"$BROWSER_ENGINE"'","--isolated"]'
            fi
            servers="$(echo "$servers" | jq -c --argjson a "$pw_args" '. + {playwright:{command:"npx",args:$a}}')"
          fi
          servers="$(echo "$servers" | jq -c --argjson extra "$EXTRA_MCP" '. + $extra')"

          if [ -n "$ALLOWED" ]; then
            tools="$ALLOWED"
          else
            tools='Bash(task:*),Bash(gh:*),Bash(git:*)'
            tools="$tools,Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(diff:*),Bash(tree:*),Bash(jq:*)"
            tools="$tools,Bash(echo:*),Bash(pwd:*),Bash(which:*),Bash(file:*),Bash(stat:*),Bash(basename:*),Bash(dirname:*),Bash(mkdir:*)"
            tools="$tools,Bash(sed:*),Bash(awk:*),Bash(xargs:*)"
            case "$LANGUAGE" in
              go)      tools="$tools,Bash(go:*)" ;;
              rust)             tools="$tools,Bash(cargo:*),Bash(rustup:*),Bash(rustc:*)" ;;
              typescript|node)  tools="$tools,Bash(node:*),Bash(npm:*)" ;;
              python)           tools="$tools,Bash(python:*),Bash(python3:*)" ;;
              bun)              tools="$tools,Bash(bun:*),Bash(bunx:*)" ;;
            esac
            [ "$NODE" = "true" ]       && tools="$tools,Bash(node:*),Bash(npm:*)"
            [ "$CONTEXT7" = "true" ]   && tools="$tools,mcp__context7"
            [ "$BROWSER" = "true" ] && tools="$tools,mcp__playwright"
            [ "$PRETTIER" = "true" ] && tools="$tools,Bash(prettier:*)"
            [ "$ESLINT" = "true" ] && tools="$tools,Bash(eslint:*)"
            [ -n "$EXTRA_TOOLS" ]      && tools="$tools,$EXTRA_TOOLS"
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            tools="$tools,Edit,Write,MultiEdit"
          fi

          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          if [ "$servers" = "{}" ]; then
            echo "mcp_arg=" >> "$GITHUB_OUTPUT"
          else
            echo "mcp_arg=--mcp-config '{\"mcpServers\":$servers}'" >> "$GITHUB_OUTPUT"
          fi

      - name: Load shared bot instructions
        id: instr
        uses: inference-gateway/.github/.github/actions/bot-instructions@main

      - name: Compose prompt
        id: prompt
        env:
          EVENT: ${{ github.event_name }}
          USER_PROMPT: ${{ inputs.prompt }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          BOARD: ${{ steps.instr.outputs.board }}
          FOLLOWUPS: ${{ steps.instr.outputs.followups }}
          STYLE: ${{ steps.instr.outputs.style }}
          ESCALATION: ${{ steps.instr.outputs.escalation }}
          BROWSER: ${{ steps.browser.outputs.enabled }}
          BROWSER_ENGINE: ${{ steps.browser.outputs.engine }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            issues)                                          context=issue ;;
            pull_request_review|pull_request_review_comment) context=pr ;;
            issue_comment) if [ "$IS_PR_COMMENT" = "true" ]; then context=pr; else context=issue; fi ;;
            *)                                               context=task ;;
          esac

          common="$(cat <<'RULES'
          **COMMIT RULES:**
          - Do NOT add "Co-authored-by" lines to commits
          - Do NOT add "Generated with Claude Code" or similar attributions
          - Keep commits clean and professional

          **OUTPUT RULES:**

          ## Commit Message Requirements (max 72 chars)
          - Use conventional commit format with lowercase type (e.g., "fix:", "feat:", "refactor:")
          RULES
          )"
          common="$(printf '%s\n\n%s\n\n%s' "$common" "$STYLE" "$ESCALATION")"
          if [ "$BROWSER" = "true" ]; then
            if [ "$BROWSER_ENGINE" = "lightpanda" ]; then
              note="**BROWSER:** A browser MCP server (mcp__playwright) backed by Lightpanda over CDP is available this run - use it to navigate, inspect, or verify live web pages. Lightpanda covers only part of the Web API surface, so a page that fails in ways that look like missing browser features is a Lightpanda limitation, not necessarily a bug in the page."
            else
              note="**BROWSER:** A headless $BROWSER_ENGINE browser MCP server (mcp__playwright) is available this run - use it to navigate, inspect, screenshot, or verify live web pages when the task calls for a real browser."
            fi
            common="$(printf '%s\n\n%s' "$common" "$note")"
          fi

          if [ "$context" = "issue" ]; then
          pr_block="$(cat <<'ISSUE'
          Implement the change and commit it, then open the pull request:
          ```
          gh pr create --title "Your descriptive title" --body "## Summary
          Your summary of what was implemented.

          Closes #__N__"
          ```
          Always include a summary of changes AND "Closes #__N__" in the body.
          ISSUE
          )"
          body="$(printf '%s\n\n%s\n\n%s' "$BOARD" "$FOLLOWUPS" "$pr_block")"
          body="${body//__N__/$ISSUE_NUMBER}"
          elif [ "$context" = "pr" ]; then
          body="$(cat <<'PR'
          **WHEN WORKING ON PR FEEDBACK:**
          Make the requested changes and commit. The PR will automatically update - do NOT open a new PR.

          **WHEN FIXING CI FAILURES:**
          Fix the issues, commit the fix. The CI will automatically re-run.
          PR
          )"
          else
          body="$(printf '%s\n\n%s' "$USER_PROMPT" "If your work changes files, commit them on a new branch and open a pull request - do NOT push to the default branch.")"
          fi

          {
            echo 'text<<__CLAUDE_PROMPT_EOF__'
            printf '%s\n\n%s\n' "$body" "$common"
            echo '__CLAUDE_PROMPT_EOF__'
          } >> "$GITHUB_OUTPUT"

          echo "::group::Composed prompt (context=$context)"
          printf '%s\n\n%s\n' "$body" "$common"
          echo "::endgroup::"

      - name: Sync memory in (restore .memory@claude)
        id: memory-sync-in
        if: inputs.memory
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          MEM_DIR="$HOME/.claude/memory"
          remote="https://x-access-token:${TOKEN}@github.com/inference-gateway/.memory.git"
          if git clone --depth 1 --single-branch --branch claude "$remote" "$MEM_DIR" 2>/dev/null; then
            echo "Restored existing memory from .memory@claude."
          else
            echo "No .memory@claude branch yet; starting a fresh memory store."
            rm -rf "$MEM_DIR"; mkdir -p "$MEM_DIR"
            git -C "$MEM_DIR" init -q -b claude
            git -C "$MEM_DIR" remote add origin "$remote"
          fi
          settings="$(jq -cn --arg d "$MEM_DIR" '{autoMemoryDirectory: $d}')"
          { echo "settings=$settings"; echo "dir=$MEM_DIR"; } >> "$GITHUB_OUTPUT"
          echo "Auto-memory relocated to: $MEM_DIR"

      - name: Install skills
        if: inputs.skills != ''
        env:
          SKILLS: ${{ inputs.skills }}
        run: |
          set -euo pipefail

          reg="$(mktemp -d)"
          git clone --quiet --depth 1 https://github.com/inference-gateway/skills.git "$reg"
          catalog="$reg/catalog.json"
          mkdir -p "$HOME/.claude/skills"
          declare -A cloned=( ["inference-gateway/skills@main"]="$reg" )

          while IFS= read -r line; do
            # Trim surrounding whitespace; skip blanks.
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -n "$line" ] || continue

            source="$(jq -r --arg n "$line" '.skills[]|select(.name==$n)|.source' "$catalog")"
            if [ -z "$source" ] || [ "$source" = "null" ]; then
              echo "::error::Skill '$line' not found in inference-gateway/skills catalog.json"
              exit 1
            fi

            rest="${source#https://github.com/}"
            slug="${rest%%/tree/*}"
            tail="${rest#*/tree/}"
            ref="${tail%%/*}"
            path="${tail#*/}"

            repo="${cloned[$slug@$ref]:-}"
            if [ -z "$repo" ]; then
              repo="$(mktemp -d)"
              git clone --quiet --depth 1 --branch "$ref" "https://github.com/$slug.git" "$repo"
              cloned[$slug@$ref]="$repo"
            fi

            if [ ! -d "$repo/$path" ]; then
              echo "::error::Skill '$line' source path '$path' missing in $slug@$ref"
              exit 1
            fi
            rm -rf "$HOME/.claude/skills/$line"
            cp -R "$repo/$path" "$HOME/.claude/skills/$line"
            echo "Installed skill: $line ($slug@$ref/$path)"
          done <<< "$SKILLS"

      - name: Compose plugin inputs
        id: settings
        env:
          PLUGINS: ${{ inputs.plugins }}
        run: |
          set -euo pipefail

          marketplaces=''
          plugins=''
          while IFS= read -r line; do
            # Trim surrounding whitespace; skip blanks.
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -n "$line" ] || continue
            name="${line##*/}"
            marketplaces="${marketplaces}https://github.com/${line}.git"$'\n'
            plugins="${plugins}${name}@${name}"$'\n'
          done <<< "$PLUGINS"
          {
            echo 'marketplaces<<__EOF__'; printf '%s' "$marketplaces"; echo '__EOF__'
            echo 'plugins<<__EOF__'; printf '%s' "$plugins"; echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
          echo "Plugin marketplaces: ${marketplaces:-<none>}"
          echo "Plugins: ${plugins:-<none>}"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.210
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          settings: ${{ steps.memory-sync-in.outputs.settings }}
          plugins: ${{ steps.settings.outputs.plugins }}
          plugin_marketplaces: ${{ steps.settings.outputs.marketplaces }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          show_full_output: ${{ inputs.debug }}
          additional_permissions: |
            actions: read
          use_commit_signing: true
          base_branch: main
          branch_prefix: ${{ steps.prefix.outputs.value }}
          claude_args: |
            --effort ${{ steps.agent.outputs.effort }}
            --model ${{ steps.agent.outputs.model }}
            --allowedTools "${{ steps.args.outputs.tools }}"
            ${{ steps.args.outputs.mcp_arg }}
            ${{ inputs.debug && '--debug' || '' }}
          prompt: ${{ steps.prompt.outputs.text }}
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Sync memory out (persist to .memory@claude)
        if: ${{ always() && inputs.memory }}
        run: |
          set -uo pipefail
          MEM_DIR="$HOME/.claude/memory"
          if [ ! -d "$MEM_DIR/.git" ]; then
            echo "Memory: no store initialized, nothing to sync." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git -C "$MEM_DIR" add -A
          if git -C "$MEM_DIR" diff --cached --quiet; then
            echo "Memory: no changes to sync." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git -C "$MEM_DIR" commit -q -m "chore(memory): sync from ${GITHUB_REPOSITORY} (run ${GITHUB_RUN_ID})"
          if git -C "$MEM_DIR" push origin HEAD:claude 2>/dev/null; then
            echo "Memory: synced to \`.memory@claude\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Memory push to .memory@claude failed (best-effort); not persisted this run."
            echo "Memory: push failed (best-effort), not persisted this run." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Preserve work-in-progress on cancel or failure
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PREFIX: ${{ steps.prefix.outputs.value }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No uncommitted changes to preserve."
            exit 0
          fi
          wip="${PREFIX}wip-${ISSUE:-$RUN_ID}"
          git switch -c "$wip"
          git add -A
          git commit -m "wip: partial work from an unfinished agent run [skip ci]"
          if ! git push -u origin "$wip"; then
            echo "Push rejected; the work remains in this run's --debug log for manual recovery."
            exit 0
          fi
          echo "Preserved working tree on branch: $wip"
          [ -n "$ISSUE" ] || exit 0
          body="$(printf 'Auto-saved partial work from a run that was cancelled before it finished (timed out or failed). For #%s - a maintainer can review this branch and continue it; there is no automatic resume.\n\nRun: %s' "$ISSUE" "$RUN_URL")"
          gh pr create --draft --base "$DEFAULT_BRANCH" --head "$wip" \
            --title "wip: ${ISSUE_TITLE:-partial work} (run did not finish)" --body "$body" \
            || echo "Draft PR not created (one may already exist)."
