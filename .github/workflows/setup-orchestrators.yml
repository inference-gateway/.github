---
name: Setup orchestrators

# Fan-out over every non-agent repos.yaml entry with an `orchestrators` block (kind: agent
# callers are generated by adl-cli, so they are never overwritten here). Per repo it writes
# .github/workflows/claude.yml and/or infer.yml as thin callers of the org reusable workflows
# from the entry's orchestrators.claude / orchestrators.infer block (plugins, tools, browser, ...)
# and opens or updates ONE PR. Use it to add a bot to a repo or change its inputs. Callers pin the
# reusable workflows at @main, so action and CLI versions are bumped centrally by bump-actions.yml.
#
# App scope required on each target: contents:write, pull-requests:write and
# workflows:write (this writes files under .github/workflows/).

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Single repos.yaml target (with an orchestrators block) to set up; blank = all'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Render + print the diff but skip PR creation (manual runs preview by default)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: read
        uses: ./.github/actions/resolve-targets
        with:
          select: '.kind != "agent" and .orchestrators != null'
          repository: ${{ inputs.repository }}

  setup:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: setup-orchestrators-${{ matrix.target.name }}
      cancel-in-progress: false
    steps:
      - name: Mint GitHub App token (scoped to ${{ matrix.target.name }})
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}
          owner: inference-gateway
          repositories: |
            ${{ matrix.target.name }}

      - name: Checkout target
        uses: actions/checkout@v7.0.1
        with:
          repository: inference-gateway/${{ matrix.target.name }}
          path: target
          token: ${{ steps.token.outputs.token }}

      - name: Render claude.yml caller
        working-directory: target
        env:
          CLAUDE_JSON: ${{ toJSON(matrix.target.orchestrators.claude) }}
          LANG: ${{ matrix.target.language }}
        run: |
          set -euo pipefail
          [ "$CLAUDE_JSON" != "null" ] || exit 0
          mkdir -p .github/workflows

          static_browser=$(echo "$CLAUDE_JSON" | jq -r 'if .browser == true then "true" else "false" end')
          static_browser_engine=$(echo "$CLAUDE_JSON" | jq -r '.browser_engine // "chromium"')
          static_effort=$(echo "$CLAUDE_JSON" | jq -r '.effort // "medium"')
          static_model=$(echo "$CLAUDE_JSON" | jq -r '.model // "claude-opus-5"')

          with_block=$(echo "$CLAUDE_JSON" | jq -r --arg lang "$LANG" '
            {language: $lang} + . | del(.browser, .browser_engine, .effort, .model)
            | to_entries
            | map(if (.value | type) == "string" and (.value | contains("\n"))
                  then "      \(.key): |\n" + (.value | rtrimstr("\n") | split("\n") | map("        " + .) | join("\n"))
                  else "      \(.key): \(.value | if type == "string" then "\"\(.)\"" else tostring end)"
                  end)
            | .[]')

          {
            cat <<'HEADER'
          ---
          name: Claude Code

          # Thin caller for the org-wide reusable @claude workflow.
          # Source of truth: inference-gateway/.github/.github/workflows/claude.yml
          # Inputs are managed centrally in inference-gateway/.github/repos.yaml (the entry's orchestrators.claude block).
          # Do not hand-edit setup here; change the reusable workflow or repos.yaml instead.

          on:
            workflow_dispatch:
              inputs:
                prompt:
                  description: 'Free-text task for Claude to work on in this repo'
                  required: true
                  type: string
                browser:
                  description: 'Enable the browser MCP (mcp__playwright) for this run'
                  required: false
                  type: boolean
                  default: false
                browser_engine:
                  description: 'Browser backend: chromium | firefox | webkit (installed via Playwright) or lightpanda (CDP container, faster, partial Web API coverage)'
                  required: false
                  type: choice
                  options:
                    - chromium
                    - firefox
                    - webkit
                    - lightpanda
                  default: chromium
                effort:
                  description: 'Claude effort level'
                  required: false
                  type: choice
                  options:
                    - low
                    - medium
                    - high
                    - xhigh
                    - max
                  default: medium
                model:
                  description: 'Claude model'
                  required: false
                  type: choice
                  options:
                    - claude-opus-5
                    - claude-opus-5-5
                    - claude-fable-5
                    - claude-fable-5-1
                    - claude-fable-5-2
                    - claude-sonnet-5
                    - claude-sonnet-5-5
                  default: claude-opus-5-5
            issue_comment:
              types:
                - created
            pull_request_review_comment:
              types:
                - created
            issues:
              types:
                - opened
                - assigned
            pull_request_review:
              types:
                - submitted

          permissions: {}

          jobs:
            claude:
              if: |
                github.event_name == 'workflow_dispatch' ||
                (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
                (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
                (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
                (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
              permissions:
                contents: write
                pull-requests: write
                issues: write
                id-token: write
                actions: read
          HEADER
            echo "    uses: inference-gateway/.github/.github/workflows/claude.yml@main"
            echo "    with:"
            echo "$with_block"
            d='$'
            echo "      browser: ${d}{{ inputs.browser || ${static_browser} }}"
            echo "      browser_engine: ${d}{{ inputs.browser_engine || '${static_browser_engine}' }}"
            echo "      effort: ${d}{{ inputs.effort || '${static_effort}' }}"
            echo "      model: ${d}{{ inputs.model || '${static_model}' }}"
            echo "      prompt: ${d}{{ inputs.prompt }}"
            echo "    secrets: inherit"
          } > .github/workflows/claude.yml

          echo "::group::Rendered .github/workflows/claude.yml"
          cat .github/workflows/claude.yml
          echo "::endgroup::"

      - name: Render infer.yml caller
        working-directory: target
        env:
          INFER_JSON: ${{ toJSON(matrix.target.orchestrators.infer) }}
          LANG: ${{ matrix.target.language }}
        run: |
          set -euo pipefail
          [ "$INFER_JSON" != "null" ] || exit 0
          mkdir -p .github/workflows

          static_browser=$(echo "$INFER_JSON" | jq -r 'if .browser == true then "true" else "false" end')
          static_browser_engine=$(echo "$INFER_JSON" | jq -r '.browser_engine // "chromium"')
          static_review_inline=$(echo "$INFER_JSON" | jq -r 'if .review_inline == true then "true" else "false" end')
          static_model=$(echo "$INFER_JSON" | jq -r '.model // "ollama_cloud/glm-5.3-flash"')

          with_block=$(echo "$INFER_JSON" | jq -r --arg lang "$LANG" '
            {language: $lang} + . | del(.browser, .browser_engine, .review_inline, .model)
            | to_entries
            | map(if (.value | type) == "string" and (.value | contains("\n"))
                  then "      \(.key): |\n" + (.value | rtrimstr("\n") | split("\n") | map("        " + .) | join("\n"))
                  else "      \(.key): \(.value | if type == "string" then "\"\(.)\"" else tostring end)"
                  end)
            | .[]')

          {
            cat <<'HEADER'
          ---
          name: Infer

          # Thin caller for the org-wide reusable @infer workflow.
          # Source of truth: inference-gateway/.github/.github/workflows/infer.yml
          # Inputs are managed centrally in inference-gateway/.github/repos.yaml (the entry's orchestrators.infer block).
          # Do not hand-edit setup here; change the reusable workflow or repos.yaml instead.

          on:
            workflow_dispatch:
              inputs:
                prompt:
                  description: 'Free-text task for infer (deepseek) to work on in this repo'
                  required: true
                  type: string
                browser:
                  description: 'Run the browser-agent A2A container for this run'
                  required: false
                  type: boolean
                  default: false
                browser_engine:
                  description: 'Browser engine: chromium | firefox | webkit or lightpanda (fastest, no graphical rendering, partial Web API coverage)'
                  required: false
                  type: choice
                  options:
                    - chromium
                    - firefox
                    - webkit
                    - lightpanda
                  default: chromium
                review_inline:
                  description: 'Post review-mode findings as inline PR review comments instead of one conversation comment'
                  required: false
                  type: boolean
                  default: false
                model:
                  description: 'Model as provider/model (empty = this repo default from repos.yaml)'
                  required: false
                  type: string
                  default: ''
            issues:
              types:
                - opened
                - edited
            issue_comment:
              types:
                - created
            pull_request_review_comment:
              types:
                - created
            pull_request_review:
              types:
                - submitted

          permissions: {}

          jobs:
            infer:
              if: |
                github.event_name == 'workflow_dispatch' ||
                (
                  github.event.sender.type != 'Bot' &&
                  !endsWith(github.actor, '[bot]') &&
                  (
                    (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@infer')) ||
                    (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@infer')) ||
                    (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@infer')) ||
                    (github.event_name == 'issues' && (contains(github.event.issue.body, '@infer') || contains(github.event.issue.title, '@infer')))
                  )
                )
              permissions:
                contents: write
                pull-requests: write
                issues: write
          HEADER
            echo "    uses: inference-gateway/.github/.github/workflows/infer.yml@main"
            echo "    with:"
            echo "$with_block"
            d='$'
            echo "      browser: ${d}{{ inputs.browser || ${static_browser} }}"
            echo "      browser_engine: ${d}{{ inputs.browser_engine || '${static_browser_engine}' }}"
            echo "      review_inline: ${d}{{ inputs.review_inline || ${static_review_inline} }}"
            echo "      model: ${d}{{ inputs.model || '${static_model}' }}"
            echo "      prompt: ${d}{{ inputs.prompt }}"
            echo "    secrets: inherit"
          } > .github/workflows/infer.yml

          echo "::group::Rendered .github/workflows/infer.yml"
          cat .github/workflows/infer.yml
          echo "::endgroup::"

      - name: Skip check
        id: skip
        working-directory: target
        run: |
          set -euo pipefail
          git add -- .github/workflows
          if git diff --cached --quiet; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.target.name }}: callers already match repos.yaml; skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show diff
        if: steps.skip.outputs.skip != 'true'
        working-directory: target
        run: git -c color.ui=always diff --cached

      - name: Create or update pull request
        if: steps.skip.outputs.skip != 'true' && !inputs.dry_run
        id: pr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.token.outputs.token }}
          path: target
          branch: bot/setup-orchestrators
          base: main
          sign-commits: true
          delete-branch: true
          add-paths: |
            .github/workflows/claude.yml
            .github/workflows/infer.yml
          commit-message: 'ci: set up orchestrators from repos.yaml'
          title: 'ci: set up orchestrators from repos.yaml'
          body: |
            ## Summary
            Writes this repo's `.github/workflows/claude.yml` / `infer.yml` as thin callers of the org reusable workflows
            (`inference-gateway/.github/.github/workflows/<bot>.yml@main`) from its `orchestrators` block in
            [`repos.yaml`](https://github.com/inference-gateway/.github/blob/main/repos.yaml).

            Inputs (plugins, tools, browser, model, ...) are managed centrally there. Change `repos.yaml` and re-run
            `setup-orchestrators.yml` instead of hand-editing the callers. Action and CLI versions live in the reusable
            workflows and are bumped by `bump-actions.yml`.

            Requires the maintainer GitHub App (`INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID` /
            `INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY`) installed on this repo plus the bot secrets, which reach the
            reusable workflows via `secrets: inherit`.

            Filed by [setup-orchestrators.yml](https://github.com/inference-gateway/.github/blob/main/.github/workflows/setup-orchestrators.yml).
          labels: |
            ci
            bot

      - name: Report PR outcome
        if: steps.skip.outputs.skip != 'true' && !inputs.dry_run && steps.pr.outputs.pull-request-number != ''
        run: |
          {
            echo "### ${{ matrix.target.name }}"
            echo "- Operation: \`${{ steps.pr.outputs.pull-request-operation }}\`"
            echo "- PR: ${{ steps.pr.outputs.pull-request-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: steps.skip.outputs.skip != 'true' && inputs.dry_run
        working-directory: target
        run: |
          {
            echo "## Dry-run: ${{ matrix.target.name }}"
            echo '```diff'
            git diff --cached
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
