---
name: Stale issues and PRs sweep

# Daily sweep across EVERY target in repos.yaml (select(true), all kinds
# including kind: none). For each repo, marks open issues AND pull requests
# with no activity for 30 days as `stale` (label + warning comment) and closes
# ones that remain stale with no activity for another 14 days. Replaces
# per-repo stale.yml workflows so the policy lives in one place.
#
# Reset semantics: both passes filter on `updated:<cutoff>`. Any activity -
# a comment, a push, or simply removing the `stale` label - bumps updatedAt,
# so the item drops out of the close pass and the 30-day clock restarts.
#
# Exempt labels:
#   - pinned, security: human override - never touch
#   - sdk-drift, adk-drift: filed by sync-docs.yml / sync-adks.yml as
#     long-lived drift trackers; they may legitimately sit open for weeks
#     while a maintainer triages.
#   - docs-coverage: legacy label from the removed audit-docs-coverage.yml;
#     kept exempt so any historical tickets survive.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Single repos.yaml target to sweep (omit = all targets). Use to test on one repo.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Print planned actions without modifying issues/PRs (manual runs preview by default; the cron sweeps for real)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: read
        uses: ./.github/actions/resolve-targets
        with:
          select: 'true'
          repository: ${{ inputs.repository }}

  sweep:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Mint App token (scoped to ${{ matrix.target.name }})
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}
          owner: inference-gateway
          repositories: |
            ${{ matrix.target.name }}

      - name: Sweep stale issues and PRs in inference-gateway/${{ matrix.target.name }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: inference-gateway/${{ matrix.target.name }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          STALE_LABEL=stale
          STALE_DAYS=30
          CLOSE_DAYS=14
          EXEMPT='-label:pinned -label:security -label:sdk-drift -label:adk-drift -label:docs-coverage'

          stale_cutoff=$(date -u -d "${STALE_DAYS} days ago" +%Y-%m-%d)
          close_cutoff=$(date -u -d "${CLOSE_DAYS} days ago" +%Y-%m-%d)

          {
            echo "### ${GH_REPO}"
            echo
            echo "- mark cutoff: \`${stale_cutoff}\` (no activity since)"
            echo "- close cutoff: \`${close_cutoff}\` (stale label + no activity since)"
            echo "- dry run: \`${DRY_RUN}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN}" != "true" ]; then
            gh label create "${STALE_LABEL}" --color ededed \
              --description "No activity for ${STALE_DAYS} days" --force
          fi

          sweep() {
            local kind=$1 noun
            case "$kind" in
              issue) noun="issue" ;;
              pr) noun="pull request" ;;
            esac

            # 1. Mark newly-stale items
            mapfile -t to_mark < <(
              gh "$kind" list \
                --state open \
                --search "updated:<${stale_cutoff} -label:${STALE_LABEL} ${EXEMPT}" \
                --limit 200 \
                --json number \
                --jq '.[].number'
            )
            echo "Marking ${#to_mark[@]} ${kind}(s) as stale"
            echo "Mark candidates (${kind}): ${#to_mark[@]}" >> "$GITHUB_STEP_SUMMARY"
            for n in "${to_mark[@]}"; do
              if [ "${DRY_RUN}" = "true" ]; then
                echo "  [DRY] would mark ${kind} #${n}"
                echo "  - [DRY] mark ${kind} #${n}" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              gh "$kind" edit "${n}" --add-label "${STALE_LABEL}"
              gh "$kind" comment "${n}" --body "This ${noun} has been marked as stale because it has had no activity for ${STALE_DAYS} days. It will be closed in ${CLOSE_DAYS} days if there is no further activity. Comment, push, or remove the \`${STALE_LABEL}\` label to keep it open."
              echo "  marked ${kind} #${n}"
              echo "  - marked ${kind} #${n}" >> "$GITHUB_STEP_SUMMARY"
            done

            # 2. Close items that have remained stale
            mapfile -t to_close < <(
              gh "$kind" list \
                --state open \
                --label "${STALE_LABEL}" \
                --search "updated:<${close_cutoff}" \
                --limit 200 \
                --json number \
                --jq '.[].number'
            )
            echo "Closing ${#to_close[@]} stale ${kind}(s)"
            echo "Close candidates (${kind}): ${#to_close[@]}" >> "$GITHUB_STEP_SUMMARY"
            for n in "${to_close[@]}"; do
              if [ "${DRY_RUN}" = "true" ]; then
                echo "  [DRY] would close ${kind} #${n}"
                echo "  - [DRY] close ${kind} #${n}" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              gh "$kind" close "${n}" --comment "Closed because it is stale: no activity for ${STALE_DAYS} days and none in the ${CLOSE_DAYS} days after being marked. Reopen it if it is still relevant."
              echo "  closed ${kind} #${n}"
              echo "  - closed ${kind} #${n}" >> "$GITHUB_STEP_SUMMARY"
            done
          }

          sweep issue
          sweep pr
