# Unified downstream registry for inference-gateway/.github orchestrators.
#
# ONE list: `targets`. Every orchestrator reads it through the shared composite action
# .github/actions/resolve-targets, passing a jq `select` expression (no more per-workflow yq
# shapes, no second `claude_targets` list).
#
# Per-entry schema:
#   name           (required)  repo name under inference-gateway/
#   kind           (required)  sdk | docs | adk | agent | none  -> routes to workflows:
#                                sdk   -> deterministic type sync: per-repo schemas-sync.yml thin
#                                         callers of the reusable schemas-sync.yml here, fanned
#                                         out by schemas' sync-downstream.yml (no orchestrator
#                                         matrix reads this kind for sync anymore)
#                                docs  -> sync-docs.yml (drift class E)
#                                adk   -> sync-adks.yml
#                                agent -> bump-adl.yml, refresh-agent-manifest.yml, trigger-cd.yml
#                                none  -> infra/tooling repos with no sync/agent family;
#                                         lifecycle sweeps + bump-flox.yml only
#                              stale.yml and cleanup-runs.yml both sweep `select(true)` -> ALL
#                              registered targets, every kind incl. none (stale.yml marks and
#                              closes inactive issues AND PRs). Private repos are never
#                              registered here, so the sweeps exclude them by construction; do NOT
#                              add a private repo to this list or they would sweep it.
#   language       (required)  LOWERCASE TOOLCHAIN: go | rust | typescript | python | node | bun. Feeds
#                              the sync-* audit-prompt display token, and refresh-agent-manifest.yml
#                              maps it to the adl --language flag (case go|rust|typescript).
#
# Adding/removing a repo = one PR editing this file. Validate the shape afterwards: see CLAUDE.md
# "Validate repos.yaml".

targets:
  # --- Core ---
  - name: inference-gateway
    kind: none
    language: go
  - name: operator
    kind: none
    language: go
  - name: cli
    kind: none
    language: go
  - name: infer-action
    kind: none
    language: bun
  - name: desktop
    kind: none
    language: bun
  - name: opentask
    kind: none
    language: bun
  - name: schemas
    kind: none
    language: bun
  - name: docs
    kind: docs
    language: bun

  # --- SDKs ---
  - name: sdk
    kind: sdk
    language: go
  - name: typescript-sdk
    kind: sdk
    language: typescript
  - name: rust-sdk
    kind: sdk
    language: rust
  - name: python-sdk
    kind: sdk
    language: python

  # --- Agent Development ---
  - name: adk
    kind: adk
    language: go
  - name: typescript-adk
    kind: adk
    language: typescript
  - name: rust-adk
    kind: adk
    language: rust

  # --- A2A Agents ---
  - name: google-calendar-agent
    kind: agent
    language: go
  - name: browser-agent
    kind: agent
    language: go
  - name: documentation-agent
    kind: agent
    language: go
  - name: grafana-agent
    kind: agent
    language: go
  - name: n8n-agent
    kind: agent
    language: go
  - name: mock-agent
    kind: agent
    language: go

  # --- Tools & Community ---
  - name: adl
    kind: none
    language: node
  - name: adl-cli
    kind: none
    language: go
  - name: a2a-debugger
    kind: none
    language: go
  - name: registry
    kind: none
    language: typescript
  - name: agents
    kind: none
    language: node
  - name: skills
    kind: none
    language: node
